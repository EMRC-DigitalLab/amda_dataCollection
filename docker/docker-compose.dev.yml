version: '3.8'

services:
  amda-api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: amda-collection-api-dev
    network_mode: host
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=31.97.56.29
      - REDIS_HOST=amda-redis-dev
      - RUN_MIGRATIONS_ON_STARTUP=true
    env_file:
      - ../.env.development
    command: sh -c "cd /app && npm run start:dev"
    volumes:
      - ../src:/app/src
      - ../scripts:/app/scripts
      - ../package.json:/app/package.json
      - ../package-lock.json:/app/package-lock.json
      - ../tsconfig.json:/app/tsconfig.json
    depends_on:
      amda-redis-dev:
        condition: service_healthy
    networks:
      - amda-dev-network
    develop:
      watch:
        - action: sync
          path: ../src
          target: /app/src
        - action: sync
          path: ../package.json
          target: /app/package.json
        - action: rebuild
          path: ../package-lock.json
        - action: sync
          path: ../tsconfig.json
          target: /app/tsconfig.json

  amda-seed-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: amda-seed-admin
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=31.97.56.29
    env_file:
      - ../.env.development
    command: npm run seed:admin
    networks:
      - amda-dev-network
    restart: "no"
    profiles:
      - seed

  amda-redis-dev:
    image: redis:7-alpine
    container_name: amda-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - amda-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # amda-mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: amda-mailhog
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"
  #   networks:
  #     - amda-dev-network

volumes:
  redis_dev_data:

networks:
  amda-dev-network:
    driver: bridge