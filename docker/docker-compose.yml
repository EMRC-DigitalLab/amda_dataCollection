# docker/docker-compose.yml (Production - External DB/Redis)
version: '3.8'

services:
  amda-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amda-collection-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ../.env.production
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - ../scripts:/app/scripts
    networks:
      - amda-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: amda-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - amda-api
    depends_on:
      - redis
    networks:
      - amda-network

  redis:
    image: redis:7-alpine
    container_name: amda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - amda-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uploads_data:
    driver: local
  logs_data:
    driver: local
  redis_data:
    driver: local

networks:
  amda-network:
    driver: bridge