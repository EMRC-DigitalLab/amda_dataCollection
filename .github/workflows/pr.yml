# .github/workflows/pr.yml
name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: |
          npm run format:check
          if [ $? -ne 0 ]; then
            echo "❌ Code is not properly formatted!"
            echo "Run 'npm run format' to fix formatting issues."
            exit 1
          fi

      - name: Run linting
        run: |
          npm run lint:check
          if [ $? -ne 0 ]; then
            echo "❌ Linting errors found!"
            echo "Run 'npm run lint' to fix linting issues."
            exit 1
          fi

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Comment PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **PR Checks Failed**\n\nPlease fix the following issues:\n- Code formatting\n- Linting errors\n- Tests\n\nRun `npm run precommit` locally to fix these issues.'
            })

      - name: Comment PR Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **All checks passed!** This PR is ready for review.'
            })