# .github/workflows/deploy.yml
name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger

env:
  DOCKER_IMAGE_NAME: amda-api
  CONTAINER_NAME: amda-collection-api
  BACKUP_CONTAINER_NAME: amda-collection-api-backup
  DEPLOY_PATH: /srv/amda/prod/app
  LOG_PATH: /srv/amda/logs

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "Host ${{ secrets.HOST }}" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
        
    - name: Deploy to Server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST }} << 'EOF'
          set -e  # Exit on any error
          
          # Create logs directory
          mkdir -p /srv/amda/logs
          
          # Function to log with timestamp
          log() {
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a /srv/amda/logs/deployment.log
          }
          
          # Function to rollback
          rollback() {
            log "STARTING ROLLBACK PROCESS"
            
            # Stop current container
            if docker ps -q -f name=amda-collection-api | grep -q .; then
              log "Stopping failed container..."
              docker stop amda-collection-api || true
              docker rm amda-collection-api || true
            fi
            
            # Restore backup container if it exists
            if docker ps -a -q -f name=amda-collection-api-backup | grep -q .; then
              log "Restoring backup container..."
              docker rename amda-collection-api-backup amda-collection-api
              docker start amda-collection-api
              log "ROLLBACK COMPLETED - Service restored to previous version"
            else
              log "NO BACKUP CONTAINER FOUND - Manual intervention required"
              exit 1
            fi
          }
          
          # Function to health check
          health_check() {
            log "Starting health check..."
            local max_attempts=30
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              if docker ps | grep -q amda-collection-api; then
                # Check if container is actually healthy
                if docker exec amda-collection-api curl -f http://localhost:3000/health 2>/dev/null || \
                   docker logs amda-collection-api 2>&1 | tail -10 | grep -v "Error\|error" >/dev/null; then
                  log "Health check passed (attempt $attempt/$max_attempts)"
                  return 0
                fi
              fi
              
              log "Health check attempt $attempt/$max_attempts failed, waiting..."
              sleep 10
              attempt=$((attempt + 1))
            done
            
            log "Health check failed after $max_attempts attempts"
            return 1
          }
          
          # Start deployment process
          log "STARTING DEPLOYMENT PROCESS"
          log "Deploying to: /srv/amda/prod/app"
          
          # Navigate to app directory
          cd /srv/amda/prod/app
          
          # Backup current running container
          if docker ps -q -f name=amda-collection-api | grep -q .; then
            log "Creating backup of current container..."
            
            # Remove old backup if exists
            if docker ps -a -q -f name=amda-collection-api-backup | grep -q .; then
              docker stop amda-collection-api-backup || true
              docker rm amda-collection-api-backup || true
            fi
            
            # Create backup
            docker stop amda-collection-api
            docker rename amda-collection-api amda-collection-api-backup
            log "Backup created successfully"
          else
            log "No running container found to backup"
          fi
          
          # Pull latest code
          log "Pulling latest code from GitHub..."
          if ! git pull origin main; then
            log "Git pull failed"
            rollback
            exit 1
          fi
          
          # Build and deploy new container
          log "Building new Docker container..."
          if ! npm run docker:prod; then
            log "Docker build failed"
            rollback
            exit 1
          fi
          
          # Wait for container to start
          sleep 5
          
          # Perform health check
          if ! health_check; then
            log "Health check failed - initiating rollback"
            # Capture logs before rollback
            docker logs amda-collection-api > /srv/amda/logs/failed_deployment_logs_$(date +%Y%m%d_%H%M%S).log 2>&1 || true
            rollback
            exit 1
          fi
          
          # Clean up old backup if deployment successful
          if docker ps -a -q -f name=amda-collection-api-backup | grep -q .; then
            log "Cleaning up old backup container..."
            docker stop amda-collection-api-backup || true
            docker rm amda-collection-api-backup || true
          fi
          
          # Clean up old images
          log "Cleaning up old Docker images..."
          docker image prune -f || true
          
          log "DEPLOYMENT COMPLETED SUCCESSFULLY"
          log "Container: amda-collection-api is now running"
          
          # Final status check
          docker ps | grep amda-collection-api || true
          
        EOF
        
    - name: Deployment Status
      if: always()
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.HOST }} << 'EOF'
          echo "=== FINAL DEPLOYMENT STATUS ==="
          echo "Date: $(date)"
          echo "Container Status:"
          docker ps | grep amda-collection-api || echo "No AMDA containers running"
          echo ""
          echo "Last 10 lines of deployment log:"
          tail -10 /srv/amda/logs/deployment.log 2>/dev/null || echo "No deployment log found"
        EOF
        
    - name: Notify on Failure
      if: failure()
      run: |
        echo "Deployment failed! Check the logs for details."
        echo "The system should have automatically rolled back to the previous version."
        
    - name: Notify on Success  
      if: success()
      run: |
        echo "Deployment successful!"
        echo "Application is now running with the latest code."